<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title description">
<title id="title">Technical toolkit infographic</title><desc id="description">Six skill categories from the original README, shown without fabricated proficiency scores</desc>
<defs>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1426"/><stop offset=".55" stop-color="#112841"/><stop offset="1" stop-color="#0A303C"/></linearGradient>
 <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#75F0E0"/><stop offset="1" stop-color="#7AB5FF"/></linearGradient>
 <pattern id="mesh" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#78BFDA" opacity=".10" fill="none"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".23"/></filter>
</defs>
<style>
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.75}}
@keyframes slide{0%{stroke-dashoffset:260}100%{stroke-dashoffset:0}}
@keyframes levitate{0%,100%{transform:translateY(0px)}50%{transform:translateY(-5px)}}
.twinkle{animation:pulse 3.8s ease-in-out infinite}.trend{stroke-dasharray:260;animation:slide 4.2s ease-out both}.float{animation:levitate 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.twinkle,.trend,.float{animation:none;stroke-dasharray:none}}
</style>
<rect x="1" y="1" width="1198" height="178" rx="22" fill="url(#back)" stroke="#326B82"/>
<text x="35" y="42" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#F0F7FF">THE TECHNICAL TOOLKIT</text>
<text x="35" y="65" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#AFCDDE">Six focus areas — grounded in the project repositories and experience</text>
<rect x="31" y="87" width="367" height="35" rx="10" fill="#102E43" stroke="#377B8D"/><circle cx="50" cy="105" r="6" fill="#72F2DF"/><text x="67" y="110" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#E1F7FA">SQL &amp; DATA MODELING</text><rect x="421" y="87" width="367" height="35" rx="10" fill="#102E43" stroke="#377B8D"/><circle cx="440" cy="105" r="6" fill="#91BBFE"/><text x="457" y="110" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#E1F7FA">BUSINESS INTELLIGENCE</text><rect x="811" y="87" width="367" height="35" rx="10" fill="#102E43" stroke="#377B8D"/><circle cx="830" cy="105" r="6" fill="#72F2DF"/><text x="847" y="110" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#E1F7FA">DATA ANALYSIS</text><rect x="31" y="132" width="367" height="35" rx="10" fill="#102E43" stroke="#377B8D"/><circle cx="50" cy="150" r="6" fill="#91BBFE"/><text x="67" y="155" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#E1F7FA">SPREADSHEETS</text><rect x="421" y="132" width="367" height="35" rx="10" fill="#102E43" stroke="#377B8D"/><circle cx="440" cy="150" r="6" fill="#72F2DF"/><text x="457" y="155" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#E1F7FA">QUALITY &amp; GOVERNANCE</text><rect x="811" y="132" width="367" height="35" rx="10" fill="#102E43" stroke="#377B8D"/><circle cx="830" cy="150" r="6" fill="#91BBFE"/><text x="847" y="155" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#E1F7FA">ERP &amp; ENGINEERING</text>

</svg>
