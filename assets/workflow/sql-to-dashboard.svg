<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title description"><title id="title">SQL to Power BI</title><desc id="description">Illustrative process showing SQL query, validated rows, transformation, metrics and BI dashboard</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080E1C"/><stop offset=".55" stop-color="#101A2E"/><stop offset="1" stop-color="#0A2044"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#4F46E5"/></linearGradient><linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132955"/><stop offset="1" stop-color="#11172F"/></linearGradient></defs><rect x="1" y="1" width="1198" height="188" rx="20" fill="url(#bg)" stroke="#F59E0B" stroke-width="2"/><text x="32" y="43" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" >SQL SERVER  →  DATA MODEL  →  POWER BI</text><rect x="27" y="63" width="212" height="102" rx="15" fill="#111E37" stroke="#4354A8" stroke-width="2"/><text x="45" y="97" fill="#A78BFA" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" >01</text><text x="45" y="137" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" >SQL QUERY</text><rect x="265" y="63" width="212" height="102" rx="15" fill="#111E37" stroke="#4354A8" stroke-width="2"/><text x="283" y="97" fill="#A78BFA" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" >02</text><text x="283" y="137" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" >ROWS</text><rect x="503" y="63" width="212" height="102" rx="15" fill="#111E37" stroke="#4354A8" stroke-width="2"/><text x="521" y="97" fill="#A78BFA" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" >03</text><text x="521" y="137" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" >TRANSFORM</text><rect x="741" y="63" width="212" height="102" rx="15" fill="#111E37" stroke="#4354A8" stroke-width="2"/><text x="759" y="97" fill="#A78BFA" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" >04</text><text x="759" y="137" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" >KPI MODEL</text><rect x="979" y="63" width="212" height="102" rx="15" fill="#111E37" stroke="#F59E0B" stroke-width="2"/><text x="997" y="97" fill="#F59E0B" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" >05</text><text x="997" y="137" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" >REPORT</text></svg>