<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title description"><title id="title">Data quality principles</title><desc id="description">Five validation dimensions: completeness, uniqueness, accuracy, consistency and validity</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080E1C"/><stop offset=".55" stop-color="#101A2E"/><stop offset="1" stop-color="#0A2044"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#4F46E5"/></linearGradient><linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132955"/><stop offset="1" stop-color="#11172F"/></linearGradient></defs><rect x="1" y="1" width="1198" height="188" rx="20" fill="url(#bg)" stroke="#14B8A6" stroke-width="2"/><text x="32" y="43" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" >DATA QUALITY INSPECTION</text><rect x="28" y="62" width="210" height="105" rx="15" fill="#111E37" stroke="#14B8A6" stroke-width="2"/><text x="46" y="97" fill="#5EEAD4" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" >01</text><text x="45" y="137" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" >COMPLETENESS</text><rect x="266" y="62" width="210" height="105" rx="15" fill="#111E37" stroke="#2563EB" stroke-width="2"/><text x="284" y="97" fill="#60A5FA" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" >02</text><text x="283" y="137" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" >UNIQUENESS</text><rect x="504" y="62" width="210" height="105" rx="15" fill="#111E37" stroke="#14B8A6" stroke-width="2"/><text x="522" y="97" fill="#5EEAD4" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" >03</text><text x="521" y="137" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" >ACCURACY</text><rect x="742" y="62" width="210" height="105" rx="15" fill="#111E37" stroke="#2563EB" stroke-width="2"/><text x="760" y="97" fill="#60A5FA" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" >04</text><text x="759" y="137" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" >CONSISTENCY</text><rect x="980" y="62" width="210" height="105" rx="15" fill="#111E37" stroke="#14B8A6" stroke-width="2"/><text x="998" y="97" fill="#5EEAD4" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" >05</text><text x="997" y="137" fill="#F8FAFC" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" >VALIDITY</text></svg>