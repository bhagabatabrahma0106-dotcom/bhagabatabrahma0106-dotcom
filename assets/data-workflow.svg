<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="184" viewBox="0 0 1200 184" role="img" aria-labelledby="title description">
<title id="title">Data work approach</title><desc id="description">Diagram of the five-step workflow already documented in the profile README</desc>
<defs>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1426"/><stop offset=".55" stop-color="#112841"/><stop offset="1" stop-color="#0A303C"/></linearGradient>
 <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#75F0E0"/><stop offset="1" stop-color="#7AB5FF"/></linearGradient>
 <pattern id="mesh" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#78BFDA" opacity=".10" fill="none"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".23"/></filter>
</defs>
<style>
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.75}}
@keyframes slide{0%{stroke-dashoffset:260}100%{stroke-dashoffset:0}}
@keyframes levitate{0%,100%{transform:translateY(0px)}50%{transform:translateY(-5px)}}
.twinkle{animation:pulse 3.8s ease-in-out infinite}.trend{stroke-dasharray:260;animation:slide 4.2s ease-out both}.float{animation:levitate 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.twinkle,.trend,.float{animation:none;stroke-dasharray:none}}
</style>
<rect x="1" y="1" width="1198" height="182" rx="22" fill="url(#back)" stroke="#326B82"/>
<text x="34" y="39" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#F0F7FF">HOW I APPROACH DATA WORK</text>
<rect x="32" y="76" width="198" height="59" rx="13" fill="#11384C" stroke="#408F9E"/><text x="48" y="99" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8AF2DF">01</text><text x="48" y="120" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#EBF6FA">Business question</text><path d="M237 105h25m-8-7 8 7-8 7" stroke="#89E9E0" stroke-width="3" fill="none"/><rect x="270" y="76" width="198" height="59" rx="13" fill="#11384C" stroke="#408F9E"/><text x="286" y="99" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8AF2DF">02</text><text x="286" y="120" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#EBF6FA">Profile &amp; validate</text><path d="M475 105h25m-8-7 8 7-8 7" stroke="#89E9E0" stroke-width="3" fill="none"/><rect x="508" y="76" width="198" height="59" rx="13" fill="#11384C" stroke="#408F9E"/><text x="524" y="99" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8AF2DF">03</text><text x="524" y="120" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#EBF6FA">Clean &amp; model</text><path d="M713 105h25m-8-7 8 7-8 7" stroke="#89E9E0" stroke-width="3" fill="none"/><rect x="746" y="76" width="198" height="59" rx="13" fill="#11384C" stroke="#408F9E"/><text x="762" y="99" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8AF2DF">04</text><text x="762" y="120" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#EBF6FA">Build BI metrics</text><path d="M951 105h25m-8-7 8 7-8 7" stroke="#89E9E0" stroke-width="3" fill="none"/><rect x="984" y="76" width="198" height="59" rx="13" fill="#11384C" stroke="#408F9E"/><text x="1000" y="99" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#8AF2DF">05</text><text x="1000" y="120" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#EBF6FA">Explain findings</text>
<text x="36" y="166" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#B0CFDE">From source data to traceable, explainable decisions — quality and limitations documented.</text>

</svg>
