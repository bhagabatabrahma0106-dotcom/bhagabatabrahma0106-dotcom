<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title description">
<title id="title">Bhagabata Brahma — Data Analyst and Power BI Developer</title>
<desc id="description">Clean, static, clickable profile header with data analysis and Power BI specialties</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1728"/><stop offset="1" stop-color="#132F43"/></linearGradient>
<style>
@keyframes reveal {from {stroke-dashoffset:280;opacity:.6} to {stroke-dashoffset:0;opacity:1}}
@keyframes breathe {0%,100% {opacity:.55} 50% {opacity:1}}
.trend-line {stroke-dasharray:280;animation:reveal 4s ease-out both}
.data-dot {animation:breathe 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.trend-line,.data-dot{animation:none;stroke-dasharray:none;opacity:1}}
</style></defs>
<rect x="1" y="1" width="1198" height="268" rx="20" fill="url(#bg)" stroke="#3E8F99" stroke-width="2"/>
<rect x="43" y="40" width="4" height="170" rx="2" fill="#83E4D6"/>
