<g fill="#2A7593"><rect x="39" y="123" width="31" height="29" rx="4"/><rect x="85" y="109" width="31" height="43" rx="4"/><rect x="131" y="116" width="31" height="36" rx="4"/><rect x="177" y="91" width="31" height="61" rx="4"/><rect x="223" y="78" width="31" height="74" rx="4"/><rect x="269" y="68" width="31" height="84" rx="4"/></g>
