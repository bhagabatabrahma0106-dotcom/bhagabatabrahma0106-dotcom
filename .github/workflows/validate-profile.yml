name: Profile visual integrity
on:
  push:
    paths:
      - README.md
      - assets/**
      - design/**
      - scripts/**
      - .github/workflows/validate-profile.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - design/**
      - scripts/**
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Check profile layout, assets and source links
        run: python scripts/validate_profile.py
