name: Profile visual integrity
on:
  push:
    paths:
      - README.md
      - assets/**
      - docs/VISUAL_DESIGN.md
      - scripts/validate_profile.py
      - .github/workflows/validate-profile.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - docs/VISUAL_DESIGN.md
      - scripts/validate_profile.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check profile layout and links
        run: python3 scripts/validate_profile.py
